<table>
  <tr>
    <td>
      <label for="firstNumber">Premier nombre:</label>
    </td>
    <td>
      <input type="number" id="firstNumber" #firstNumber>
    </td>
  </tr>

  <tr>
    <td>
      <label for="secondNumber">Second nombre:</label>
    </td>
    <td>
      <input type="number" id="secondNumber" #secondNumber>
    </td>
  </tr>

  <tr>
    <td>
      <label for="operation">Operation:</label>
    </td>
    <td>
      <select id="operation" #operation>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </td>
  </tr>

  <tr>
    <td>
      <button (click)="calculate(firstNumber.value, secondNumber.value, operation.value)">
        Calculer
      </button>
    </td>
    <td>
      Resultat: {{ result }}
    </td>
  </tr>
</table>
